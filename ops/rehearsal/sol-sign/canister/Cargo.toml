[package]
name = "rook_sol_sign"
version = "0.1.0"
edition = "2021"
description = "Spike Q3 (docs/v9/solana-migration.md §2.4, §4): a canister holds a Solana identity with threshold Ed25519, signs a durable-nonce transfer, sends it through HTTPS outcalls to Solana devnet and resends the same saved bytes. Devnet only."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# the buyer's own versions (autobuyer/canister-rs/Cargo.lock), so the outcall and signing API are the ones the real canister would use
candid = "=0.10.35"
ic-cdk = "=0.19.0"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "0.10"
base64 = "0.22.1"
# join_all: both providers asked concurrently
futures = { version = "0.3", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
