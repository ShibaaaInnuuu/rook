[package]
name = "rook_relay_sol_spike"
version = "0.1.0"
edition = "2021"
description = "Spike Q5 (docs/v9/spikes/q5-relay-solana-legs.md): how the canister judges and binds a Relay order from a Solana origin, proved on real quotes and real mainnet transactions. Pure: no network, no keys; signs and sends nothing."
publish = false

# standalone: never part of another workspace
[workspace]

[dependencies]
serde_json = "1"
hex = "0.4.3"
sha2 = "0.10"
sha3 = "0.10"
base64 = "0.22"
# only for the PDA rule (a program address must be OFF the ed25519 curve)
curve25519-dalek = "4"
