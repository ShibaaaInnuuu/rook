      <main class="page" style="padding-top:5rem">
        <h1 class="h1">Memecoins that buy the floor.</h1>
        <noscript><p>This site needs JavaScript to read the chain. Without it you can still read what Rook is: a launchpad on Solana where every coin is tied to one blue-chip NFT collection. Coins trade on Meteora's bonding curve; at its collection's graduation tier (85, 170, 255 or 510 SOL) a coin graduates into a permanently locked pool, and half of its raise is set aside as NFT backing for its holders, enough to buy at least one NFT right away. Rook's own programs are not yet deployed or independently audited.</p></noscript>
