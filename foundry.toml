[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
# Surface.t.sol reads the compiler's own artifacts to assert what the vaults expose. Read-only.
fs_permissions = [{ access = "read", path = "./out" }, { access = "read", path = "./test/fixtures" }, { access = "read", path = "./staging/chain-id.json" }, { access = "read-write", path = "./deployments" }]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 64

# docs/phase3.md §3: the default profile above is the fast one CI runs. This is the deep one, run by hand before a release:
#   FOUNDRY_PROFILE=deep forge test --no-match-path "test/fork/*"
[profile.deep.fuzz]
runs = 10000

[profile.deep.invariant]
runs = 1000
depth = 200

# the public RPC of Robinhood Chain (4663); fork tests use it and nothing else
[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
