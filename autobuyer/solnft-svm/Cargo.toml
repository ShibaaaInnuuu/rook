[package]
name = "solnft_svm"
version = "0.1.0"
edition = "2021"
publish = false
description = "LiteSVM checks of the canister's Solana NFT transactions (docs/v9/solana-nfts-canister.md §7): the canister's own builders, executed against the marketplace and Metaplex programs dumped from mainnet, on real mainnet accounts."

# standalone: not a member of the canister's or the Solana programs' build
[workspace]

[dev-dependencies]
etch_autobuyer = { path = "../canister-rs" }
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "3.4.0"
solana-pubkey = "3"
solana-instruction = "3"
solana-clock = "3"
serde_json = "1"
base64 = "0.22"
bincode = "1"
