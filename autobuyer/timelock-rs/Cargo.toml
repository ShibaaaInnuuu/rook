[package]
name = "etch_timelock"
version = "0.1.0"
edition = "2021"
description = "The buyer's only controller: an upgrade waits a public delay, can be vetoed, and is then executed by anyone. docs/v2/timelock-controller.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Lowers the delay floor from 72 hours to 10 seconds, and lets one principal be both proposer and guardian, for replica tests.
# It changes the module hash, so a rehearsal timelock cannot pass for a production one.
rehearsal = []

[dependencies]
candid = "0.10"
ic-cdk = "0.19"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
sha2 = "0.10"
hex = "0.4.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
